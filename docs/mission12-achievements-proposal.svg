<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="#0c0b11"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="38" fill="#edb3d4" font-size="16">CLUBE DAS WINX · PROPOSTA ILUSTRATIVA — NÃO PUBLICADA</text><text x="36" y="76" fill="#f6f2f8" font-size="26">Conquistas no contexto de cada vida</text><rect x="36" y="101" width="650" height="373" rx="16" fill="#17131d" stroke="#493441"/><text x="60" y="137" fill="#edb3d4" font-size="13">RANKING / SOBREVIVENTE · EXEMPLO</text><text x="60" y="173" fill="#fff" font-size="23">Conquistas desta vida</text><text x="60" y="204" fill="#cac1cc" font-size="16">4 níveis conquistados · 2 medalhas exibidas</text><rect x="60" y="229" width="280" height="160" rx="12" fill="#211c24" stroke="#ecd18c"/><text x="83" y="268" fill="#ecd18c" font-size="26">✦</text><text x="83" y="306" fill="#ecd18c" font-size="19">Exterminador — Ouro</text><text x="83" y="338" fill="#cfc6d2" font-size="14">Bronze, Prata e Ouro contam</text><text x="83" y="361" fill="#cfc6d2" font-size="14">Somente Ouro é exibido</text><rect x="360" y="229" width="300" height="160" rx="12" fill="#211c24" stroke="#b4739d"/><text x="383" y="268" fill="#edb3d4" font-size="26">◇</text><text x="383" y="306" fill="#f5eaf2" font-size="19">Mil sobre rodas</text><text x="383" y="338" fill="#cfc6d2" font-size="14">Especial · critério próprio</text><text x="383" y="361" fill="#cfc6d2" font-size="14">Exige contador validado</text><text x="60" y="435" fill="#a99fad" font-size="14">Evidência observada · data exata do feito pode ser desconhecida</text><rect x="711" y="101" width="353" height="173" rx="16" fill="#17131d" stroke="#493441"/><text x="735" y="137" fill="#edb3d4" font-size="13">MEMORIAL / MESMO PAINEL</text><text x="735" y="175" fill="#fff" font-size="22">Medalhas preservadas</text><text x="735" y="208" fill="#cac1cc" font-size="15">Esta vida morreu.</text><text x="735" y="234" fill="#cac1cc" font-size="15">Seu progresso permanece congelado.</text><rect x="711" y="295" width="353" height="179" rx="16" fill="#17131d" stroke="#493441"/><text x="735" y="331" fill="#a99fad" font-size="13">ESTADO ATUAL SEM IDENTIDADE</text><text x="735" y="369" fill="#fff" font-size="21">Conquistas indisponíveis</text><text x="735" y="402" fill="#cac1cc" font-size="15">Identidade desta vida pendente.</text><text x="735" y="431" fill="#a99fad" font-size="14">Nenhuma medalha presumida.</text></g></svg>